<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title id="pageTitle">Warframe Builds - Minch Configuration</title>

  <meta id="metaDescription" name="description" content="Configurations Warframe optimisées par Minch. Builds, fragments d'archonte, armes et compagnons pour chaque Warframe.">
  <meta id="metaKeywords" name="keywords" content="Warframe build, Warframe configuration, Warframe builds, Minch Warframe, Warframe fragments archonte">
  <meta name="author" content="Minch">

  <meta id="ogTitle" property="og:title" content="Minch Warframe Builds">
  <meta id="ogDescription" property="og:description" content="Les meilleures configurations Warframe par Minch">
  <meta property="og:type" content="website">
  <meta id="ogUrl" property="og:url" content="">
  <meta property="og:site_name" content="Minch's Build">

  <link id="canonicalLink" rel="canonical" href="">
  <link rel="stylesheet" href="style.css">

  <script type="application/ld+json" id="seoJsonLd">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Minch's Build",
    "url": ""
  }
  </script>
</head>

<body>
  <!-- Vidéo fond accueil -->
  <video
    id="homeBgVideo"
    class="bg-video bg-video-home"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source src="media/home-loop.mp4" type="video/mp4">
  </video>

  <!-- Overlay léger -->
  <div class="screen-overlay"></div>

  <!-- Musique -->
  <audio id="bgMusic" loop preload="auto">
    <source src="media/background-music.mp3" type="audio/mpeg">
  </audio>

  <!-- Contrôle musique -->
  <div class="music-panel" id="musicPanel">
    <button id="musicToggle" class="music-toggle paused" type="button" aria-label="Lancer la musique">
      <span class="music-disc"></span>
      <span class="music-icon" id="musicIcon">
        <svg id="iconPlay" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5v14l11-7z"></path>
        </svg>
        <svg id="iconPause" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 5h4v14H7zM13 5h4v14h-4z"></path>
        </svg>
      </span>
    </button>

    <div class="volume-wrap">
      <input id="volumeSlider" type="range" min="0" max="100" value="50" aria-label="Volume musique">
    </div>
  </div>



  <!-- Admin / éditeur -->
  <button id="adminButton" class="admin-button" type="button">Admin</button>

  <div id="adminLoginModal" class="admin-modal" aria-hidden="true">
    <div class="admin-modal-card admin-login-card">
      <button class="admin-back" type="button" data-admin-close aria-label="Retour">←</button>
      <h2>Connexion Admin</h2>
      <p class="admin-hint">Entre ton identifiant et ton mot de passe pour activer le mode éditeur.</p>
      <input id="adminUser" class="admin-input" type="text" placeholder="Identifiant">
      <div class="admin-password-wrap">
        <input id="adminPass" class="admin-input" type="password" placeholder="Mot de passe">
        <button id="adminPasswordToggle" class="admin-eye" type="button" aria-label="Afficher le mot de passe">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5c5.2 0 9.2 4.2 10.6 6.2.3.5.3 1.1 0 1.6C21.2 14.8 17.2 19 12 19S2.8 14.8 1.4 12.8c-.3-.5-.3-1.1 0-1.6C2.8 9.2 6.8 5 12 5zm0 2C7.9 7 4.6 10.1 3.3 12c1.3 1.9 4.6 5 8.7 5s7.4-3.1 8.7-5C19.4 10.1 16.1 7 12 7zm0 2.2A2.8 2.8 0 1 1 12 14.8 2.8 2.8 0 0 1 12 9.2z"></path>
          </svg>
        </button>
      </div>
      <button id="adminLoginSubmit" class="admin-primary" type="button">Se connecter</button>
      <p id="adminLoginError" class="admin-error"></p>
    </div>
  </div>

  <div id="adminEditorModal" class="admin-modal admin-editor-modal" aria-hidden="true">
    <div class="admin-modal-card admin-editor-card">
      <button class="admin-back" type="button" data-editor-close aria-label="Retour">←</button>
      <div id="adminEditorContent"></div>
    </div>
  </div>

  <!-- Contenu accueil -->
  <div id="homeUI" class="home-ui reveal">
    <header>
      <h1>Minch's Warframe Configurations</h1>
    </header>

    <div class="search-container">
      <input
        id="search"
        type="text"
        placeholder="Rechercher Warframe..."
        oninput="filterWarframes()"
      >
    </div>

    <div id="warframeGrid" class="grid"></div>
  </div>

  <!-- Transition -->
  <div id="pageTransition" class="page-transition"></div>

  <!-- Page build -->
  <div id="buildPage" class="buildpage">
    <button class="back" onclick="closeBuild()" aria-label="Retour">←</button>

    <div class="build-layout">
      <div id="buildContent" class="build-content"></div>
    </div>
  </div>

  <!-- Firebase compat SDK : laisse ces lignes si tu veux la sauvegarde en ligne Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
